# Home page, and the gateway for every app on the domain. Static sites never sleep, so this
# front door stays fast even while the apps behind it are spun down on the free tier.
services:
  - type: web
    name: home
    runtime: static
    # Generates public/index.html (English) and public/de/index.html (German) from src/ and i18n/.
    buildCommand: node build.mjs
    staticPublishPath: public
    domains: [florian-piel.space, www.florian-piel.space]
    routes:
      - type: rewrite
        source: /tracker/*
        destination: https://tracker-web-y2tx.onrender.com/tracker/*
      - type: rewrite
        source: /omnistore/*
        destination: https://omnistore-react.onrender.com/omnistore/*
      - type: rewrite
        source: /game/*
        destination: https://whiskers-warehouse-leap.onrender.com/*
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Only on the home pages themselves: the apps behind the rewrites bring their own policies.
      # connect-src lets app.js ping the OmniStore API, which lives on its own subdomain.
      - path: /
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self' https://api.florian-piel.space; frame-ancestors 'none'"
      - path: /index.html
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self' https://api.florian-piel.space; frame-ancestors 'none'"
      - path: /de/
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self' https://api.florian-piel.space; frame-ancestors 'none'"
      - path: /de/index.html
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self' https://api.florian-piel.space; frame-ancestors 'none'"

  # Whisker's Warehouse Leap, the jumping game from the frontend course. Plain static files
  # with no build step, served on this domain under /game/.
  - type: web
    name: whiskers-warehouse-leap
    runtime: static
    repo: https://github.com/Lollopie/Whiskers-Warehouse-Leap
    branch: main
    buildCommand: echo "No build step"
    staticPublishPath: .
